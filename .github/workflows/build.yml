name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Which platforms to build comes from the repo variable BUILD_TARGETS (comma list of
  # Linux, macOS, Windows). Unset means macOS and Windows.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        env:
          TARGETS: ${{ vars.BUILD_TARGETS || 'macOS' }}
        run: |
          json="["; sep=""
          for t in ${TARGETS//,/ }; do
            case "$t" in
              Linux)   e='{"name":"Linux","os":"ubuntu-24.04","generator":"Ninja"}' ;;
              macOS)   e='{"name":"macOS","os":"macos-15-intel","generator":"Ninja"}' ;;
              Windows) e='{"name":"Windows","os":"windows-2022","generator":"Visual Studio 17 2022"}' ;;
              *) echo "Unknown target: $t"; exit 1 ;;
            esac
            json="$json$sep$e"; sep=","
          done
          echo "targets=$json]" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DVF_BUILD_SNAPSHOT_TOOL=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: UI screenshots (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          tool=$(find build -name vf_snapshot -type f -perm -u+x | head -1)
          models=build/_deps/nam_core-src/example_models
          mkdir -p screenshots
          "$tool" nam screenshots/nam-amp-head.png "$models/wavenet.nam"
          "$tool" nambrowser screenshots/nam-browser.png "$models/wavenet.nam"
          "$tool" default screenshots/main.png

      - name: Upload screenshots
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VFXAamps-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      - name: Build DMG installer (macOS)
        if: runner.os == 'macOS'
        run: scripts/make_dmg.sh build/app/VFXAamps_artefacts/Release build/dist

      - name: Upload DMG installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: VFXAamps-macOS-DMG
          path: build/dist/*.dmg
          if-no-files-found: error

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: VFXAamps-${{ matrix.name }}
          path: |
            build/app/VFXAamps_artefacts/Release/VST3
            build/app/VFXAamps_artefacts/Release/Standalone
            build/app/VFXAamps_artefacts/Release/AU
          if-no-files-found: warn
